<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loopic Legal Links</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="aux-page">
    <main class="aux-wrap" style="max-width:760px">
      <header>
        <h1 class="aux-title">Loopic 정책 문서 링크 관리</h1>
        <p class="aux-sub">Paywall의 Privacy/Terms 버튼은 이 페이지로 연결됩니다. 운영 링크를 이 페이지에서 중앙 관리하세요.</p>
      </header>

      <section id="privacy" class="aux-card">
        <span class="aux-tag">Privacy Policy</span>
        <h2>개인정보 처리방침</h2>
        <a href="https://loopic.app/privacy" target="_blank" rel="noopener">https://loopic.app/privacy</a>
      </section>

      <section id="terms" class="aux-card">
        <span class="aux-tag">Terms of Service</span>
        <h2>이용약관</h2>
        <a href="https://loopic.app/terms" target="_blank" rel="noopener">https://loopic.app/terms</a>
      </section>

      <p class="aux-sub">운영 환경에서 주소가 변경되면 이 파일의 링크만 수정하면 됩니다.</p>
    </main>
  </body>
</html>
