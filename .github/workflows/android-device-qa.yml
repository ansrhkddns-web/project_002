name: android-device-qa

on:
  workflow_dispatch:
  push:
    branches: ["work"]
    paths:
      - 'android/**'
      - 'scripts/android-device-qa.sh'
      - 'scripts/android-sync-assets.sh'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'ops-dashboard.html'
      - 'legal-links.html'
      - 'ads_config.json'
      - 'sdk_keys.json'

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Sync web assets
        run: ./scripts/android-sync-assets.sh

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug

      - name: Run device QA smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb devices
            ./scripts/android-device-qa.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload QA report artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-device-qa-report
          path: |
            artifacts/qa_reports/android_device_qa_last_run.md
            android_device_qa_logcat.txt
