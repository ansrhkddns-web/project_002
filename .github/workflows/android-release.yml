name: android-release

on:
  workflow_dispatch:
  push:
    branches: ["work"]
    paths:
      - 'android/**'
      - 'scripts/android-sync-assets.sh'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'ops-dashboard.html'
      - 'legal-links.html'
      - 'ads_config.json'
      - 'sdk_keys.json'

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      PACKAGE_NAME: com.timeflow.app
      PLAY_TRACK: internal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Sync web assets into Android project
        run: ./scripts/android-sync-assets.sh

      - name: Build release AAB
        run: |
          cd android
          gradle bundleRelease

      - name: Sign release AAB (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          jarsigner \
            -keystore /tmp/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (optional)
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
